<!DOCTYPE html>
<html lang="en">
<!--
  ===========================================================================

    NISEKO VILLAGE — LIBRO DE BIENVENIDA
    Winter 2026-2027 · 40 paginas · 10 idiomas

  ---------------------------------------------------------------------------

    TODO ESTA EN ESTE ARCHIVO. Solo las imagenes van aparte, en la carpeta
    img/. No hay que compilar nada: lo que ves aqui es lo que sale en el
    navegador.

    El archivo es largo, asi que usa Ctrl+F (Cmd+F en Mac) y busca la MARCA
    de la seccion que quieras. Estas son todas:

      BUSCA ESTO                         PARA CAMBIAR
      ---------------------------------  ------------------------------------
      SECCION: COLORES                   colores y tipografias
      SECCION: ESTILOS                   todo el CSS
      SECCION: DENSIDAD                  si un texto genera scroll
      SECCION: AUTOAJUSTE                red de seguridad si un texto no cabe
      SECCION: ESTRUCTURA                anadir, quitar o mover paginas
      SECCION: AJUSTES                   velocidad, umbral de escritorio

      IDIOMA: ENGLISH                    textos en ingles
      IDIOMA: JAPONES                    textos en japones
      IDIOMA: ESPANOL                    textos en espanol
      IDIOMA: TAILANDES                  textos en tailandes
      IDIOMA: TURCO                      textos en turco
      IDIOMA: COREANO                    textos en coreano
      IDIOMA: CHINO                      textos en chino
      IDIOMA: NEPALI                     textos en nepali
      IDIOMA: BIRMANO                    textos en birmano
      IDIOMA: VIETNAMITA                 textos en vietnamita

      SECCION: MOTOR                     la logica (no hace falta tocarla)

  ---------------------------------------------------------------------------

    COMO EDITAR UN TEXTO

    Busca el idioma, luego el numero de la pagina dentro de `pages`, y cambia
    lo que hay entre las etiquetas <p>. Por ejemplo:

        4: `
          <p>Hace mucho tiempo, Niseko era una region agricola...</p>
        `,

    Reglas:
      · Los textos van entre acentos graves ` , no entre comillas.
      · No quites las comas del final de cada bloque.
      · No cambies los numeros de pagina.
      · NUNCA escribas la etiqueta de cierre de script (menor-que, barra,
        script, mayor-que) dentro de un texto: cortaria el archivo por la
        mitad y el libro dejaria de cargar entero.

    Si el libro deja de cargar despues de editar, casi siempre es una comilla
    o una coma. Abre la consola del navegador con F12 y te dice la linea.

    Consejo: guarda una copia antes de una tanda grande de cambios. Al estar
    todo en un archivo, un error de sintaxis deja el libro en blanco entero,
    no solo un idioma.

  ---------------------------------------------------------------------------

    COMO PROBARLO EN TU ORDENADOR

    Abrirlo con doble clic SI funciona en esta version, porque ya no hay
    archivos externos que cargar. Si algo falla, usa un servidor local:

        python3 -m http.server 8000

    y abre http://localhost:8000

  ===========================================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>Niseko Village Onboarding Book | Winter 2026–2027</title>
<link rel="icon" href="favicon.ico">

<!-- Tipografias. Si el sitio debe funcionar sin internet, borra estas 3 lineas
     y el libro usara Georgia + la fuente del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>

  /* ==========================================================================
     SECCION: ESTILOS
     Aqui esta todo el CSS. Los colores estan en SECCION: COLORES, justo abajo.
     ========================================================================== */

  /* =========================================================================
     SECCION: COLORES
     Cambia aqui los colores y las tipografias de todo el libro.
     ========================================================================= */
  :root {
    --paper:      #f8f5ef;
    --paper-edge: #ece6da;
    --ink:        #1a1a1a;
    --ink-light:  #565049;
    --accent:     #1a3a5c;   /* azul Niseko  */
    --accent2:    #c8a96e;   /* dorado       */
    --night:      #0d1b2a;
    --red:        #b03a2b;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Lato", "Noto Sans JP", "Noto Sans Thai", "Noto Sans Myanmar",
                 "Noto Sans Devanagari", "Hiragino Sans", "Yu Gothic",
                 system-ui, -apple-system, sans-serif;

    --shadow-lift: 0 10px 30px -12px rgba(0,0,0,.5);

    /* Tamaño de letra de la pagina 2 (el indice) y del menu "Contents".
       Los dos usan el mismo valor a proposito, para que se vean iguales.
       No cambia si subes o bajas el tamaño de los parrafos mas abajo. */
    --toc-font-size:       clamp(16.5px, 2.11vh, 20.5px);
    --toc-font-size-tight: clamp(15px, 1.92vh, 18px);   /* pantallas muy bajas */

    /* Velocidad del pase de pagina. Subelo si lo quieres mas lento. */
    --slide-speed: .42s;
    --slide-ease:  cubic-bezier(.33, .01, .2, 1);
  }


  /* ============================= 2. BASE =============================== */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body { font-family: var(--font-body); }

  .app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1d4269 0%, transparent 70%),
      linear-gradient(170deg, #0b1725 0%, #0d1b2a 55%, #08131f 100%);
  }

  button { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent2);
    outline-offset: 2px;
  }


  /* ============================ 3. PORTADA ============================= */
  .welcome {
    position: absolute;
    inset: 0;
    display: flex;
    padding: 24px;
    overflow-y: auto;
  }

  .welcome__aurora {
    /* fixed (no absolute): asi no cuenta como "contenido" para el scroll
       de .welcome — es puro fondo, no debe poder desplazarse ni generar
       una barra de scroll que no lleva a ningun sitio. */
    position: fixed;
    inset: -20%;
    pointer-events: none;
    filter: blur(10px);
    background:
      radial-gradient(closest-side, rgba(200,169,110,.16), transparent) 20% 25% / 55% 55% no-repeat,
      radial-gradient(closest-side, rgba( 90,160,220,.14), transparent) 80% 70% / 60% 60% no-repeat;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(2%, -2%) scale(1.06); } }

  .welcome__inner {
    /* Centrado con margin:auto en vez de justify/align-items:center — asi,
       combinado con el overflow-y:auto de arriba, el scroll solo aparece
       si de verdad hace falta (si no, el flex + overflow crea un hueco de
       scroll "fantasma" aunque el contenido ya quepa). */
    position: relative;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }

  .welcome__logo {
    width: 112px;
    height: 112px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-lift);
  }
  .welcome__logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .welcome__title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(26px, 5.5vw, 40px);
    line-height: 1.25;
    letter-spacing: .01em;
  }

  .welcome__sub {
    margin: 0;
    color: var(--accent2);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .welcome__label {
    margin: 8px 0 0;
    color: rgba(255,255,255,.55);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* Selector de idioma: un desplegable normal (como el <select> nativo del
     navegador), no una cuadricula de botones. El scroll de la lista de
     idiomas lo pone el propio navegador — no hay que programarlo. */
  .lang-select-wrap {
    position: relative;
    width: min(320px, 88vw);
  }

  .lang-select {
    width: 100%;
    height: 54px;         /* fijo: asi no cambia de tamaño al elegir idioma,
                              aunque el texto sea mas largo o mas corto */
    padding: 0 44px 0 20px;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    line-height: 54px;    /* centra el texto en vertical junto con la altura fija */
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 12px;
    box-shadow: var(--shadow-lift);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  .lang-select:hover  { background: rgba(255,255,255,.14); }
  .lang-select:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  /* La flechita de abajo: como quitamos la del navegador (appearance:none),
     se dibuja esta a mano. Es solo decorativa (pointer-events:none). */
  .lang-select-wrap::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 18px;
    width: 9px;
    height: 9px;
    border-right: 2px solid var(--accent2);
    border-bottom: 2px solid var(--accent2);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  .cta {
    margin-top: 6px;
    padding: 14px 46px;
    color: #17202a;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .04em;
    background: linear-gradient(135deg, #d8bc82, var(--accent2));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 26px rgba(200,169,110,.38);
    transition: transform .16s, box-shadow .16s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(200,169,110,.5); }


  /* ============================= 4. LECTOR ============================= */
  .reader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  .reader[hidden] { display: none; }

  .topbar, .botnav {
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: rgba(9,18,29,.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .topbar {
    height: 52px;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .topbar__brand {
    padding: 0;
    color: var(--accent2);
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: .08em;
    background: none;
    border: none;
    cursor: pointer;
  }
  .topbar__dot { opacity: .6; }

  .topbar__actions { display: flex; align-items: center; gap: 8px; }

  .chip {
    padding: 6px 12px;
    color: rgba(255,255,255,.82);
    font-size: 12px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .chip:hover { color: var(--accent2); background: rgba(200,169,110,.2); }

  .langmenu { position: relative; }

  .langmenu__list {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 40;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px;
    min-width: 210px;
    padding: 6px;
    background: #10202f;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    box-shadow: var(--shadow-lift);
  }
  .langmenu__list[hidden] { display: none; }

  .langmenu__item {
    padding: 9px 12px;
    color: rgba(255,255,255,.85);
    font-size: 13px;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .langmenu__item:hover { background: rgba(255,255,255,.08); }
  .langmenu__item.is-active { color: var(--accent2); font-weight: 700; }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .book {
    position: relative;
    overflow: hidden;              /* recorta la pagina que entra y la que sale */
    border-radius: 6px;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,.55));
  }

  .botnav {
    height: 58px;
    border-top: 1px solid rgba(255,255,255,.08);
  }

  .nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 36px;
    color: #fff;
    font-size: 22px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(200,169,110,.24); }
  .nav-btn:active:not(:disabled) { transform: scale(.92); }
  .nav-btn:disabled { opacity: .28; cursor: default; }

  .progress {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress__bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #d8bc82, var(--accent2));
    transition: width .4s;
  }

  .counter {
    min-width: 62px;
    color: rgba(255,255,255,.6);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .hint {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    padding: 7px 16px;
    color: rgba(255,255,255,.75);
    font-size: 11.5px;
    white-space: nowrap;
    background: rgba(9,18,29,.85);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
  }
  .hint.is-visible { opacity: 1; }


  /* ====================== 5. PAGINAS Y DESLIZAMIENTO =================== */
  /* Cada `.slide` es lo que se ve de una vez: una pagina en movil/tablet,
     dos paginas en escritorio. Al pasar, la que sale se va hacia un lado y
     la que entra llega desde el otro. */

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    will-change: transform;
  }
  .slide.is-moving { transition: transform var(--slide-speed) var(--slide-ease); }

  .leaf {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    background: var(--paper);
    overflow: hidden;
  }
  .leaf--left  { border-radius: 6px 2px 2px 6px; box-shadow: inset -14px 0 26px -18px rgba(0,0,0,.55); }
  .leaf--right { border-radius: 2px 6px 6px 2px; box-shadow: inset  14px 0 26px -18px rgba(0,0,0,.45); }
  .leaf--single { border-radius: 6px; }

  /* Lomo del libro, solo en el spread de escritorio */
  .spine {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    z-index: 6;
    width: 22px;
    transform: translateX(-50%);
    pointer-events: none;
    background: linear-gradient(90deg,
      rgba(0,0,0,.22), rgba(0,0,0,.05) 42% 58%, rgba(0,0,0,.22));
  }

  /* --- tipos de pagina --- */
  .pg-img {                       /* imagen que llena la pagina */
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .pg-fit {                       /* imagen completa, sin recortar */
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 0;
    overflow: hidden;
  }
  .pg-fit img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

  .pg-scroll {                    /* imagen larga con scroll vertical */
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .pg-scroll img { width: 100%; height: auto; display: block; }

  .pg-split {                     /* media imagen (mapa a doble pagina) */
    width: 100%;
    height: 100%;
    background-repeat: no-repeat;
    background-size: 200% 100%;
  }
  .pg-split--left  { background-position: left center; }
  .pg-split--right { background-position: right center; }


  /* ====================== 6. CONTENIDO DE TEXTO ======================== */
  .pg-text {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: clamp(20px, 4%, 36px) clamp(18px, 5%, 34px) 18px;
    color: var(--ink);
    background: var(--paper);
    font-size: clamp(21px, 2.67vh, 26px);
    line-height: 1.82;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .pg-text::-webkit-scrollbar { width: 4px; }
  .pg-text::-webkit-scrollbar-thumb { background: var(--paper-edge); border-radius: 2px; }

  /* La palabra "Chapter" (o su traduccion): antes era una etiqueta en
     mayusculas tipo formulario. Ahora es una linea en cursiva azul, con la
     misma fuente elegante de los titulos, mas parecida a un libro impreso.
     La "C" ya no tiene un formato distinto: toda la palabra es igual. */
  .ch-eyebrow {
    margin-bottom: 8px;
    color: var(--accent);
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: .02em;
  }

  /* En japones, chino, coreano, tailandes, nepali y birmano la cursiva no
     existe como tal: el navegador la simula inclinando el trazo, y con
     estos alfabetos queda torcido en vez de elegante. Se deja recto ahi. */
  .ch-eyebrow:lang(ja), .ch-eyebrow:lang(zh), .ch-eyebrow:lang(ko),
  .ch-eyebrow:lang(th), .ch-eyebrow:lang(ne), .ch-eyebrow:lang(my) {
    font-style: normal;
    letter-spacing: .04em;
  }

  .ch-title {
    margin-bottom: 18px;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: clamp(22px, 3.1vh, 30px);
    line-height: 1.18;
    clear: both;
  }

  .sec-title {
    margin-bottom: 14px;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: clamp(19px, 2.6vh, 24px);
    font-weight: 700;
  }

  .subsec {
    margin: 15px 0 4px;
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
  }

  /* Los nombres de comercios (a) Hanko Hiroba, b) Cocoroya, c) Ki Gift Shop)
     usan esta clase en vez de .subsec, para poder darles su propio tamaño
     sin afectar a los demas subtitulos del libro (p.ej. "Get here by Train"). */
  .shop-name {
    margin: 15px 0 4px;
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
  }

  .pg-text p {
    margin: 0 0 0.85em;
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
  }

  /* Texto mas grande que el tamaño base de la pagina (se usa en el parrafo
     introductorio y los horarios de la pagina de supermercados). Usa "em"
     en vez de un px fijo para que el aumento siga siendo relativo, incluso
     si el auto-encogimiento (js-fit) reduce el tamaño base. */
  .text-plus2 { font-size: calc(1em + 2px); }
  .text-plus4 { font-size: calc(1em + 4px); }

  .pg-text ul { margin: 0.3em 0 0.85em 1.2em; padding: 0; list-style: outside; }
  .pg-text li { margin-bottom: 0.4em; }
  .pg-text li::marker { font-size: 1em; }
  .pg-text em { color: var(--ink-light); }

  .transport-list { margin: 0.5em 0 0.85em 1.2em; padding: 0; }
  .transport-list li { margin-bottom: 0.45em; font-size: 1em; }
  .transport-list li::marker { font-size: 1em; }
  .transport-list a { font-size: 1em; }

  .alert-box {
    margin: 1.1em 0;
    padding: 12px 14px;
    color: var(--red);
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.55;
    text-align: center;
    background: rgba(176,58,43,.07);
    border: 1px solid rgba(176,58,43,.55);
    border-radius: 8px;
  }

  .info-link {
    display: block;
    margin: 2px 0 8px;
    color: var(--accent);
    font-size: 18px;
    word-break: break-all;
  }

  .hotel-block { margin-bottom: 1.1em; }
  .hotel-name {
    margin-bottom: 4px;
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
  }

  .pnum {
    margin-top: auto;
    padding-top: 14px;
    color: #a9a094;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-align: center;
  }

  /* Pagina de texto con imagen debajo.
     La imagen ocupa el hueco que queda y nunca se sale de la pagina. */
  .pg-text__figure {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 8px 0;
  }
  .pg-text__figure img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }

  /* Pagina final */
  .pg-closing {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 10% 6% 6%;
    text-align: center;
    background: var(--paper);
  }
  .pg-closing__title {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1a1a;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(28px, 6vh, 50px);
    line-height: 1.3;
  }
  .pg-closing__logos {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    width: 100%;
    column-gap: clamp(14px, 3vw, 40px);
    padding-top: clamp(16px, 3vh, 32px);
  }
  .pg-closing__logos img {
    height: clamp(28px, 6vh, 60px);
    width: auto;
    max-width: 28%;
    object-fit: contain;
    flex-shrink: 1;
  }


  /* ============================= 7. INDICE ============================= */

  /* La pagina 2 (el indice) y el menu lateral "Contents" comparten tamaño

     COLORES), no el tamaño de los parrafos del resto del libro. Asi, si
     subes o bajas la letra de las demas paginas, esta no se mueve. */
  .pg-text--toc, .drawer__body { font-size: var(--toc-font-size); }

  .toc { padding: clamp(20px, 4%, 36px) clamp(18px, 5%, 34px) 18px; }

  .toc-title {
    margin-bottom: 20px;
    color: var(--accent);

    display: flex;

  .drawer__head {

    justify-content: space-between;
    padding: 16px 18px;
    color: var(--accent2);
    font-family: var(--font-display);

  .drawer__body .toc-title { display: none; }


  /* SECCION: DENSIDAD
     --- Densidad del texto ------------------------------------------------
     El texto no debe generar scroll en ninguna pagina. Lo que aprieta a las
     paginas es el ALTO de pantalla, no el ancho: un portatil de 720px de alto
     tiene menos sitio que un movil vertical. Por eso hay dos tramos.
     Se gana espacio quitando aire (interlineado y margenes), no encogiendo
     la letra. Si alguna pagina te sale con scroll, baja `line-height` aqui.

     El tamaño de letra de estos dos tramos es el mismo en TODAS las paginas
     (calculado a partir de la pagina mas ajustada, la de los hoteles). Si
     una pagina concreta no cupiera, SECCION: AUTOAJUSTE la encoge ella sola
     un poco, sin tocar las demas. */

  @media (max-width: 1023px), (max-height: 880px) {
    .pg-text {
      padding: clamp(16px, 3.4%, 28px) clamp(16px, 4.6%, 28px) 12px;

    .pnum        { padding-top: 8px; }

    .toc-title   { margin-bottom: 12px; }
    .toc-ch      { margin-top: 11px; padding-bottom: 4px; }
    .toc-item    { padding: 3px 0 3px 12px; }
  }

  /* Pantallas bajas: portatiles de 720p, moviles pequeños, iPad horizontal. */
  @media (max-height: 790px) {

    .pnum        { padding-top: 6px; }

    /* Reafirma el tamaño propio del indice/drawer: la regla de arriba
       (`.pg-text`) tiene la misma especificidad y, sin esto, ganaria por
       venir despues en el CSS. */
    .pg-text--toc, .drawer__body { font-size: var(--toc-font-size-tight); }

    .toc         { padding: 16px 18px 10px; }
    .toc-title   { margin-bottom: 8px; }
    .toc-ch      { margin-top: 7px; padding-bottom: 3px; }
    .toc-item    { padding: 2px 0 2px 11px; }
  }

  /* ==================== 9. MOVIL / ACCESIBILIDAD ======================= */
  @media (max-width: 600px) {

  }

  @media (prefers-reduced-motion: reduce) {

  }

        <p>Long ago, Niseko was a quiet farming and fishing region in Hokkaido, Japan, known mostly for its potato fields and the striking view of Mount Yotei, often called the <em>"Mt. Fuji of Hokkaido."</em></p>
        <p>For centuries, the Ainu people, the indigenous inhabitants of Hokkaido, lived in harmony with the rivers, forests, and volcanic mountains. The name "Niseko" itself comes from the Ainu language, meaning a "sheer cliff jutting over a riverbank".</p>
      `,
      6: `

        <p>Word spread, and the once-sleepy villages of Hirafu, Anrupuri, and Hanazono transformed into international ski resorts. Today, Niseko is famous worldwide as a winter paradise. It welcomes visitors from all over the globe with its deep snow, hot springs, and vibrant mix of cultures.</p>
      `,

        <p>We make it a priority to care for one another, not just through the work we do, but by sharing moments of joy, laughter, and connection. From team events to simple everyday gestures, we celebrate our bond and show genuine appreciation for each person who makes Niseko Family so special.</p>

    pages: {
      4: `
        <p>かつてニセコは、日本の北海道にある静かな農業と漁業の町で、ジャガイモ畑と、しばしば<em>「北海道の富士山」</em>と呼ばれる羊蹄山の壮大な景観で主に知られていました。</p>
        <p>何世紀にもわたり、北海道の先住民であるアイヌの人々は、川や森、火山とともに調和して暮らしてきました。「ニセコ」という名前自体もアイヌ語に由来し、「川岸にそそり立つ断崖」を意味します。</p>
      `,
      6: `
        <p>20世紀後半、すべてが変わりました。オーストラリアをはじめ世界各地から訪れた冒険好きなスキーヤーたちが、ニセコの秘密を発見したのです。シベリアからの冷たい風が日本海とぶつかることで生まれる、世界でも屈指の軽くドライなパウダースノーでした。</p>
        <p>この噂はまたたく間に広まり、かつて静かだった比羅夫、アンヌプリ、花園の村々は、国際的なスキーリゾートへと変貌を遂げました。今日、ニセコは世界的に有名な冬のパラダイスです。深い雪、温泉、そして多彩な文化が交わる魅力で、世界中から訪れる人々を迎えています。</p>
      `,
      8: `
        <p>夏には、また違った表情を見せてくれます — 緑豊かな山々、澄んだ川、新鮮な農産物、そしてアウトドアの数々のアクティビティ。ニセコは、地域の伝統と世界のエネルギーが出会う唯一無二の場所へと成長しました。そのすべてを、羊蹄山が静かに見守っています。</p>
      `,
      10: `
        <p>ニセコファミリーでは、私たちの最大の強みは「人」であると信じています。私たちのチームは世界中から集まったメンバーで構成されており、それぞれが独自の背景とエネルギーをもたらしてくれます。共に、私たちは職場というよりも家庭のような文化を築いてきました — 誰もが大切にされる、大きく多様な家族です。</p>
        <p>私たちは、仕事を通じてだけでなく、喜びや笑い、つながりの瞬間を分かち合うことで、お互いを気にかけ合うことを大切にしています。チームイベントから日々のちょっとした心遣いまで、私たちは絆を祝い、ニセコファミリーを特別なものにしてくれる一人ひとりに心からの感謝を表しています。</p>
      `,
      12: `
        <div class="hotel-block"><div class="hotel-name">ヒルトン ニセコビレッジ</div>
        <p>502室を有するフルサービスの山岳リゾート。スキーイン・スキーアウト、天然温泉、5つのメインレストラン、バー、フィットネスセンター、そしてニセコゴンドラへの直接アクセスを備えています。ご家族、グループ、会議のご利用、そして王道のリゾート体験を求めるお客様に最適です。</p>
        </div>
        <div class="hotel-block"><div class="hotel-name">日ノ出ヒルズ ニセコビレッジ、キュリオ・コレクション・バイ・ヒルトン</div>
        <p>プライバシーと快適なアクセスを兼ね備えたブティックレジデンス。細部にまで行き届いた心配り「おもいやり」を通じて、温かさを表現しています。広々として意図的にデザインされた空間と、一人ひとりに合わせた洗練された体験が融合し、親密で、丁寧で、唯一無二のニセコ滞在を生み出します。キッチネット付きの広々としたスタジオやアパートメントを備えたオールスイートの高級レジデンスホテルで、長期滞在、ご家族、そしてヒルトンのサービスを備えたアパートメントスタイルの滞在を求めるお客様に最適です。</p>
        </div>
      `,
      14: `
        <div class="hotel-block"><div class="hotel-name">ザ・グリーンリーフ ニセコビレッジ、タペストリー・コレクション・バイ・ヒルトン</div>
        <p>日本初のタペストリー・コレクション・バイ・ヒルトンとして、このホテルは自然、デザイン、アートを装飾としてではなく、滞在そのものの一部として結びつけています。ザ・グリーンリーフ ニセコビレッジでは、「山岳文化」が一つの生き方です — 動くこと、自然に根差すこと、そしてアルパインホスピタリティの受け継がれた伝統に導かれることで定義されています。ニセコの鼓動に寄り添う、活動的で社交的、そして心から癒されるホテルです。</p>
        <p>スキーイン・スキーアウトの利便性、天然温泉、モダンな客室、そしてくつろいだ雰囲気を備えた現代的なブティックスタイルのホテルです。ニセコビレッジ内にとどまりながら、より静かな滞在を求めるカップルやスキーヤーに人気です。</p>
        </div>
      `,

      28: `
        <p>新千歳空港から：新千歳空港駅からJR快速エアポートに乗り、小樽駅へ向かいます（一部の便は札幌での乗り換えが必要ですが、直通の便もあります）。小樽までの所要時間は約75〜90分です。</p>
        <p>小樽駅で、倶知安またはニセコ方面行きのJR函館本線の普通列車に乗り換えます。小樽からの所要時間の目安は：倶知安駅まで1.5〜2時間｜ニセコ駅まで約2時間｜合計の所要時間：接続状況により約3〜4時間です。</p>

      34: `
        <p>ウタリ食堂は毎日午前7時から午後7時まで営業しており、4種類の日替わりメニュー、新鮮なサラダコーナー、ベーカリーコーナーを提供しています。勤務日には、2枚の食事チケットをご利用いただけます。</p>

      4: `
        <p>Hace mucho tiempo, Niseko era una tranquila región agrícola y pesquera de Hokkaido, Japón, conocida principalmente por sus campos de patatas y por la impresionante vista del monte Yotei, a menudo llamado el <em>"Monte Fuji de Hokkaido."</em></p>
        <p>Durante siglos, el pueblo ainu, los habitantes indígenas de Hokkaido, vivió en armonía con los ríos, los bosques y las montañas volcánicas. El propio nombre "Niseko" proviene de la lengua ainu y significa "un acantilado escarpado que se eleva sobre la orilla de un río".</p>
      `,
      6: `
        <p>Todo cambió a finales del siglo XX, cuando esquiadores aventureros de Australia y de otros lugares descubrieron el secreto de Niseko: parte de la nieve en polvo más ligera y seca del mundo, gracias a los vientos helados de Siberia que chocan con el Mar de Japón.</p>
        <p>La noticia se difundió, y los antaño tranquilos pueblos de Hirafu, Annupuri y Hanazono se transformaron en estaciones de esquí internacionales. Hoy, Niseko es famosa en todo el mundo como un paraíso invernal. Recibe a visitantes de todo el planeta con su nieve profunda, sus aguas termales y su vibrante mezcla de culturas.</p>
      `,
      8: `
        <p>En verano, revela otra faceta — montañas verdes, ríos cristalinos, productos frescos y aventuras al aire libre. Niseko se ha convertido en un lugar único donde las tradiciones locales se encuentran con la energía global, todo bajo la atenta mirada del monte Yotei.</p>
      `,
      10: `
        <p>En Niseko Family, creemos que nuestra mayor fortaleza es nuestra gente. Nuestro equipo está formado por miembros de todo el mundo, cada uno aportando su propio trasfondo y energía únicos. Juntos, hemos creado una cultura que se siente menos como un lugar de trabajo y más como un hogar - una familia grande y diversa donde todos son valorados.</p>
        <p>Nos hacemos una prioridad cuidarnos los unos a los otros, no solo a través del trabajo que hacemos, sino compartiendo momentos de alegría, risas y conexión. Desde los eventos de equipo hasta los simples gestos del día a día, celebramos nuestro vínculo y mostramos un aprecio genuino por cada persona que hace que Niseko Family sea tan especial.</p>
      `,
      12: `
        <div class="hotel-block"><div class="hotel-name">Hilton Niseko Village</div>
        <p>Un resort de montaña de servicio completo con 502 habitaciones, acceso ski-in/ski-out, aguas termales naturales (onsen), cinco restaurantes principales, un bar, centro de fitness y acceso directo al Góndola de Niseko. Ideal para familias, grupos, reuniones y huéspedes que buscan una experiencia de resort clásica.</p>
        </div>
        <div class="hotel-block"><div class="hotel-name">Hinode Hills Niseko Village, Curio Collection by Hilton</div>
        <p>Una residencia boutique que combina privacidad con un acceso sin complicaciones, donde la calidez se expresa a través del omoiyari - una consideración atenta en cada detalle. Espacios amplios y diseñados con intención se encuentran con experiencias personalizadas y cuidadosamente seleccionadas, creando una estancia en Niseko que se siente íntima, meditada y única. Un hotel-residencia de lujo, todo suites, con estudios y apartamentos espaciosos con kitchenette, ideal para estancias prolongadas, familias y huéspedes que buscan un alojamiento estilo apartamento con el servicio de Hilton.</p>
        </div>
      `,
      14: `
        <div class="hotel-block"><div class="hotel-name">The Green Leaf Niseko Village, Tapestry Collection by Hilton</div>
        <p>El primer Tapestry Collection by Hilton en Japón, este hotel entrelaza la naturaleza, el diseño y el arte como parte de la estancia - no como decoración. En The Green Leaf Niseko Village, "Sangaku Bunka" es una forma de vida - definida por el movimiento, arraigada en la naturaleza y guiada por las duraderas tradiciones de la hospitalidad alpina. Es un hotel que sigue el ritmo de Niseko: activo, sociable y verdaderamente reparador.</p>
        <p>Un hotel boutique contemporáneo que ofrece la comodidad de ski-in/ski-out, un onsen natural, habitaciones modernas y un ambiente relajado. Popular entre parejas y esquiadores que buscan una estancia más tranquila sin dejar de estar dentro de Niseko Village.</p>
        </div>

      28: `
        <p>Desde el Aeropuerto de New Chitose: toma el tren JR Rapid Airport desde la Estación del Aeropuerto de New Chitose hasta la Estación de Otaru (algunos trayectos requieren hacer transbordo en Sapporo, mientras que otros continúan directamente). El trayecto hasta Otaru dura entre 75 y 90 minutos aproximadamente.</p>
        <p>En la Estación de Otaru, haz transbordo al tren local de la Línea Principal JR Hakodate con destino a Kutchan o Niseko. El tiempo de viaje desde Otaru es aproximadamente: Estación de Kutchan: 1,5–2 horas | Estación de Niseko: unas 2 horas | Trayecto total: alrededor de 3-4h, dependiendo de las conexiones.</p>
        <p>Desde Sapporo: toma un tren JR desde la Estación de Sapporo hasta la Estación de Otaru (unos 35–45 minutos). Haz transbordo al tren local de la Línea Principal JR Hakodate hacia Kutchan o Niseko. El tramo Otaru–Niseko dura entre 90 y 120 minutos, y los trenes son relativamente poco frecuentes, así que revisa el horario antes de viajar. Trayecto total: aproximadamente 2,5–3 horas.</p>

      4: `
        <p>오래전 니세코는 일본 홋카이도의 조용한 농업 및 어업 지역으로, 감자밭과 종종 <em>"홋카이도의 후지산"</em>이라 불리는 요테이산의 인상적인 경관으로 주로 알려져 있었습니다.</p>
        <p>수 세기 동안 홋카이도의 원주민인 아이누족은 강과 숲, 화산과 조화를 이루며 살아왔습니다. "니세코"라는 이름 자체도 아이누어에서 유래했으며, "강둑 위로 우뚝 솟은 가파른 절벽"이라는 뜻을 담고 있습니다.</p>
      `,
      6: `
        <p>20세기 후반, 호주를 비롯한 세계 각지에서 온 모험심 강한 스키어들이 니세코의 비밀을 발견하면서 모든 것이 바뀌었습니다. 시베리아에서 불어오는 차가운 바람이 일본해와 부딪히며 만들어내는, 세계에서 가장 가볍고 건조한 파우더 스노우였습니다.</p>
        <p>이 소식은 빠르게 퍼져나갔고, 한때 한적했던 히라후, 안누푸리, 하나조노 마을은 국제적인 스키 리조트로 탈바꿈했습니다. 오늘날 니세코는 세계적으로 유명한 겨울의 낙원입니다. 깊은 눈, 온천, 그리고 활기 넘치는 다문화의 조화로 전 세계 방문객들을 맞이하고 있습니다.</p>

      10: `

      4: `
        <p>很久以前，二世古还是日本北海道一个宁静的农渔业地区，主要以马铃薯田和羊蹄山的壮丽景色而闻名，羊蹄山常被称为<em>"北海道的富士山"</em>。</p>
        <p>几个世纪以来，北海道的原住民阿伊努人一直与河流、森林和火山和谐共处。"二世古"这个名字本身就源自阿伊努语，意为"耸立于河岸之上的陡峭悬崖"。</p>
      `,
      6: `
        <p>20世纪末，一切都发生了变化，当时来自澳大利亚及世界各地的冒险滑雪者发现了二世古的秘密：由于西伯利亚的冷风与日本海相遇碰撞，这里拥有世界上最轻盈、最干燥的粉雪之一。</p>
        <p>消息不胫而走，曾经宁静的比罗夫、安努普利和花园村，摇身一变成为国际滑雪胜地。如今，二世古作为冬季天堂而闻名于世，以其深厚的积雪、温泉和多元文化的交融，欢迎着来自世界各地的游客。</p>
      `,
      8: `

      `,
      10: `

        <p>धेरै पहिले, निसेको जापानको होक्काइडोमा रहेको एउटा शान्त कृषि र माछा मार्ने क्षेत्र थियो, जुन मुख्यतया आफ्ना आलुका खेतहरू र प्रायः <em>"होक्काइडोको फुजी पर्वत"</em> भनिने योतेई पर्वतको आकर्षक दृश्यका लागि परिचित थियो।</p>
        <p>शताब्दीयौंसम्म, होक्काइडोका आदिवासी बासिन्दा आइनु जनताहरू नदी, वन र ज्वालामुखी पर्वतहरूसँग सामञ्जस्यमा बसोबास गर्थे। "निसेको" नाम आफैं आइनु भाषाबाट आएको हो, जसको अर्थ "नदी किनारमाथि ठाडो उठेको भिरालो चट्टान" भन्ने हुन्छ।</p>

        <p>ရေးရေးနှင့် ကနေ့ နီဆေကို (Niseko) သည် ဂျပန်နိုင်ငံ ဟိုက္ကိုင်ဒိုတွင် တည်ရှိသော ငြိမ်းချမ်းသည့် စိုက်ပျိုးရေးနှင့် ငါးဖမ်းလုပ်ငန်း ဒေသတစ်ခုဖြစ်ပြီး အာလူးလယ်ကွက်များနှင့် <em>"ဟိုက္ကိုင်ဒိုရဲ့ ဖူဂျီတောင်"</em> ဟုခေါ်လေ့ရှိသော ယိုတေအိ တောင် (Mount Yotei) ၏ ထင်ရှားသော မြင်ကွင်းဖြင့် အများဆုံးသိရှိကြသည်။</p>
        <p>ရာစုနှစ်များစွာကြာအောင်၊ ဟိုက္ကိုင်ဒို၏ ဇာတိလူမျိုးများဖြစ်သော အိုင်နူး (Ainu) လူမျိုးတို့သည် မြစ်များ၊ တောများနှင့် မီးတောင်များနှင့်အတူ သဟဇာတဖြစ်စွာ နေထိုင်ခဲ့ကြသည်။ "နီဆေကို" ဟူသော အမည်သည် အိုင်နူးဘာသာစကားမှ ဆင်းသက်လာပြီး "မြစ်ကမ်းပါးအပေါ်တွင် စူးရှစွာထောင်မတ်နေသော ကျောက်တောင်" ဟု အဓိပ္ပာယ်ရှိသည်။</p>
      `,
      6: `
        <p>20 ရာစုနှောင်းပိုင်း၌ အရာအားလုံးပြောင်းလဲသွားခဲ့သည်၊ သြစတြေးလျနှင့် အခြားနေရာများမှ စွန့်စားချင်သော စကီးစီးသမားများသည် နီဆေကို၏ လျှို့ဝှက်ချက်ကို ရှာဖွေတွေ့ရှိခဲ့ကြသည်— ဆိုက်ဘီးရီးယားမှ ရေခဲမှုန်လေများသည် ဂျပန်ပင်လယ်နှင့် တိုက်ခိုက်ခြင်းကြောင့် ဖြစ်ပေါ်လာသည့် ကမ္ဘာပေါ်တွင် အပေါ့ဆုံးနှင့် အခြောက်ဆုံး မှုန်ဆွတ်ဆွတ်နှင်း (powder snow) များထဲမှ အချို့ဖြစ်သည်။</p>
        <p>သတင်းသည် ကျယ်ပြန့်စွာ ပျံ့နှံ့သွားပြီး၊ တစ်ချိန်က တိတ်ဆိတ်နေသော ဟီရာဖု (Hirafu)၊ အန်နူပူရီ (Annupuri) နှင့် ဟာနာဇိုနို (Hanazono) ရွာများသည် နိုင်ငံတကာ စကီးရဲသတ်ဇုန်များအဖြစ် ပြောင်းလဲသွားခဲ့ကြသည်။ ယနေ့တွင် နီဆေကိုသည် ဆောင်းရာသီပရဒိသုအဖြစ် ကမ္ဘာတစ်ဝှမ်း နာမည်ကြီးလာသည်။ ၎င်းသည် နက်ရှိုင်းသောနှင်း၊ ရေပူစမ်းများနှင့် စည်ကားသော ယဉ်ကျေးမှုပေါင်းစုံဖြင့် ကမ္ဘာအနှံ့မှ ဧည့်သည်များကို ကြိုဆိုနေသည်။</p>
      `,
      8: `
        <p>နွေရာသီတွင် ၎င်းသည် အခြားတစ်ဖက်ကို ဖော်ပြသည် — စိမ်းလန်းသောတောင်များ၊ ကြည်လင်သောမြစ်များ၊ လတ်ဆတ်သောသီးနှံများနှင့် ပြင်ပလှုပ်ရှားမှု စွန့်စားခန်းများ။ နီဆေကိုသည် ယိုတေအိတောင်၏ စောင့်ကြည့်မှုအောက်တွင် ဒေသန္တရ ရိုးရာနှင့် ကမ္ဘာလုံးဆိုင်ရာ စွမ်းအင်တို့ တွေ့ဆုံရာ ထူးခြားသော နေရာတစ်ခုအဖြစ် ကြီးထွားလာခဲ့သည်။</p>
      `,
      10: `
        <p>Niseko Family တွင်၊ ကျွန်ုပ်တို့၏ အကြီးမားဆုံးအားသာချက်မှာ ကျွန်ုပ်တို့၏ ဝန်ထမ်းများဖြစ်သည်ဟု ကျွန်ုပ်တို့ ယုံကြည်သည်။ ကျွန်ုပ်တို့၏ အဖွဲ့သည် ကမ္ဘာတစ်ဝှမ်းမှ အဖွဲ့ဝင်များပါဝင်ပြီး၊ တစ်ဦးစီသည် မိမိတို့၏ ထူးခြားသော နောက်ခံနှင့် စွမ်းအင်ကို ယူဆောင်လာကြသည်။ အတူတကွ၊ ကျွန်ုပ်တို့သည် အလုပ်ခွင်တစ်ခုထက် အိမ်တစ်လုံးနှင့်ပိုမိုတူသော ယဉ်ကျေးမှုတစ်ခုကို ဖန်တီးခဲ့ကြသည် - လူတိုင်းတန်ဖိုးထားခံရသော ကြီးမားပြီး ကွဲပြားသော မိသားစုကြီးတစ်ခုဖြစ်သည်။</p>
        <p>ကျွန်ုပ်တို့သည် လုပ်ငန်းခွင်မှတစ်ဆင့်သာမက ပျော်ရွှင်မှု၊ ရယ်သံနှင့် ချစ်ကြည်ရင်းနှီးမှု အခိုက်အတန့်များကို မျှဝေခြင်းဖြင့် တစ်ဦးနှင့်တစ်ဦး ဂရုစိုက်ရန်ကို ဦးစားပေးထားသည်။ အဖွဲ့ဆိုင်ရာ ပွဲအခမ်းအနားများမှသည် ရိုးရှင်းသော နေ့စဉ်လုပ်ဆောင်ချက်များအထိ၊ ကျွန်ုပ်တို့သည် ကျွန်ုပ်တို့၏ ချည်နှောင်မှုကို ဂုဏ်ပြုပြီး Niseko Family ကို ထူးခြားစေသော လူတိုင်းအပေါ် အမှန်တကယ် ကျေးဇူးတင်ကြောင်း ပြသကြသည်။</p>
      `,
      12: `

        <p>အခန်း 502 ခန်းပါရှိသော ဝန်ဆောင်မှုအပြည့်အစုံပေးသည့် တောင်ပေါ်အနားယူစခန်းကြီးဖြစ်ပြီး ski-in/ski-out ဝင်ထွက်ခွင့်၊ သဘာဝရေပူစမ်း (onsen)၊ အဓိကစားသောက်ဆိုင် ငါးဆိုင်၊ ဘား(bar)တစ်ခု၊ ကျန်းမာရေးလေ့ကျင့်ခန်းစင်တာနှင့် Niseko Gondola သို့ တိုက်ရိုက်ဝင်ထွက်ခွင့်ရှိသည်။ မိသားစုများ၊ အုပ်စုများ၊ အစည်းအဝေးများနှင့် ရိုးရာအနားယူစခန်း အတွေ့အကြုံကို ရှာဖွေနေသော ဧည့်သည်များအတွက် အထူးသင့်တော်သည်။</p>

      4: `
        <p>Ngày xưa, Niseko từng là một vùng nông nghiệp và ngư nghiệp yên bình ở Hokkaido, Nhật Bản, được biết đến chủ yếu nhờ những cánh đồng khoai tây và khung cảnh núi Yotei ấn tượng, thường được gọi là <em>"núi Phú Sĩ của Hokkaido."</em></p>
        <p>Trong nhiều thế kỷ, người Ainu, cư dân bản địa của Hokkaido, đã sống hòa hợp với sông ngòi, rừng núi và những ngọn núi lửa. Chính cái tên "Niseko" cũng bắt nguồn từ tiếng Ainu, có nghĩa là "một vách đá dựng đứng nhô ra bên bờ sông".</p>
      `,
      6: `
        <p>Mọi thứ thay đổi vào cuối thế kỷ 20, khi những người trượt tuyết ưa mạo hiểm từ Úc và nhiều nơi khác phát hiện ra bí mật của Niseko: một trong những loại tuyết bột nhẹ và khô nhất thế giới, nhờ những cơn gió lạnh giá từ Siberia va chạm với biển Nhật Bản.</p>
        <p>Tin tức lan truyền nhanh chóng, và những ngôi làng từng yên tĩnh như Hirafu, Annupuri và Hanazono đã biến đổi thành các khu nghỉ dưỡng trượt tuyết quốc tế. Ngày nay, Niseko nổi tiếng khắp thế giới như một thiên đường mùa đông. Nơi đây chào đón du khách từ khắp nơi trên toàn cầu với lớp tuyết dày, suối nước nóng và sự pha trộn văn hóa sống động.</p>
      `,
      8: `
        <p>Vào mùa hè, nơi đây lại khoác lên mình một diện mạo khác — những ngọn núi xanh mướt, dòng sông trong vắt, nông sản tươi ngon và các hoạt động phiêu lưu ngoài trời. Niseko đã phát triển thành một nơi độc đáo, nơi truyền thống địa phương gặp gỡ nguồn năng lượng toàn cầu, tất cả đều dưới ánh nhìn dõi theo của núi Yotei.</p>

      10: `
        <p>Tại Niseko Family, chúng tôi tin rằng sức mạnh lớn nhất của mình chính là con người. Đội ngũ của chúng tôi bao gồm các thành viên đến từ khắp nơi trên thế giới, mỗi người mang đến nền tảng và nguồn năng lượng riêng biệt của mình. Cùng nhau, chúng tôi đã xây dựng nên một văn hóa mà cảm giác không giống một nơi làm việc mà giống một mái nhà hơn - một gia đình lớn, đa dạng, nơi mọi người đều được trân trọng.</p>
        <p>Chúng tôi ưu tiên việc quan tâm lẫn nhau, không chỉ thông qua công việc mà chúng tôi làm, mà còn bằng cách chia sẻ những khoảnh khắc vui vẻ, tiếng cười và sự kết nối. Từ các sự kiện của đội nhóm đến những cử chỉ đơn giản hàng ngày, chúng tôi tôn vinh mối liên kết của mình và bày tỏ sự trân trọng chân thành đối với mỗi người đã làm cho Niseko Family trở nên đặc biệt như vậy.</p>

      28: `
        <p>Từ Sân bay New Chitose: đi tàu JR Rapid Airport từ Ga Sân bay New Chitose đến Ga Otaru (một số hành trình cần đổi tàu tại Sapporo, trong khi một số khác đi thẳng). Chuyến đi đến Otaru mất khoảng 75–90 phút.</p>

      38: `

        <ul><li><strong>Goshiki</strong> — Năm Sắc Màu, Một Sự Hài Hòa!</li><li><strong>Zento</strong> — Truyền thống châu Á cùng sự trù phú của Hokkaido.</li><li><strong>Melt Bar &amp; Grill</strong> — Buffet Ăn Thỏa Thích.</li><li><strong>The Flame</strong> — Lửa, Món Ăn &amp; Rượu Vang. Nhạc Jazz Trực Tiếp Hàng Ngày.</li><li><strong>Ezo Pub</strong> — Burger &amp; Sushi Ăn Thỏa Thích.</li><li><strong>Sisam</strong> — Nhà Hàng Nhật Bản.</li></ul>

  };


  /* ==========================================================================
     SECCION: MOTOR
     La logica del libro. Normalmente no hace falta tocar nada de aqui.
     ========================================================================== */





  /* ============================== ESTADO =============================== */

  var LANGS   = ['en', 'ja', 'es', 'th', 'tr', 'ko', 'zh', 'ne', 'my', 'vi']
                  .filter(function (c) { return CONTENT[c]; });

  var state = {
    lang:   CONFIG.defaultLang,
    spread: false,   // true = dos paginas
    view:   0,       // indice dentro de `views`
  };

  var views    = [];      // cada entrada es un array de 1 o 2 paginas
  var animating = false;
  var pointerDidDrag = false;   // true si el ultimo toque fue un arrastre,
                                // no un tap — evita que un swipe que termina
                                // sobre un boton del indice tambien lo "clickee"

  var $ = function (id) { return document.getElementById(id); };

  var el = {
    welcome:   $('welcome'),  reader:    $('reader'),
    wTitle:    $('wTitle'),   wSub:      $('wSub'),      wLabel: $('wLabel'),
    langSelect: $('langSelect'), startBtn:  $('startBtn'),
    homeBtn:   $('homeBtn'),  tocBtn:    $('tocBtn'),
    langBtn:   $('langBtn'),  langList:  $('langList'),
    stage:     $('stage'),    book:      $('book'),
    prevBtn:   $('prevBtn'),  nextBtn:   $('nextBtn'),
    progress:  $('progressBar'), counter: $('counter'), hint: $('hint'),
    drawer:    $('drawer'),   drawerScrim: $('drawerScrim'),
    drawerClose: $('drawerClose'), drawerTitle: $('drawerTitle'),
    drawerBody: $('drawerBody'),
  };


  /* ============================= UTILIDADES ============================ */

  /* Devuelve un texto del idioma actual, con el ingles como respaldo. */
  function L(key) {
    var c = CONTENT[state.lang];
    if (c && c.labels && c.labels[key] != null) return c.labels[key];
    var en = CONTENT.en;
    if (en && en.labels && en.labels[key] != null) return en.labels[key];
    return key;
  }

  function UI(key) {
    var c = CONTENT[state.lang];
    if (c && c.ui && c.ui[key] != null) return c.ui[key];
    var en = CONTENT.en;
    return (en && en.ui && en.ui[key]) || '';
  }

  function bodyFor(pageNum) {
    var c = CONTENT[state.lang];
    if (c && c.pages && c.pages[pageNum] != null) return c.pages[pageNum];
    var en = CONTENT.en;
    return (en && en.pages && en.pages[pageNum]) || '';
  }

  function styleString(obj) {
    if (!obj) return '';
    var out = [];
    for (var k in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
      var prop = k.replace(/[A-Z]/g, function (m) { return '-' + m.toLowerCase(); });
      out.push(prop + ':' + obj[k]);
    }
    return out.join(';');
  }


  /* ========================== CONSTRUIR VISTAS ========================= */

  function buildViews(spread) {
    var out = [];
    if (spread) {
      for (var i = 0; i < PAGES.length; i += 2) out.push(PAGES.slice(i, i + 2));
    } else {
      PAGES.forEach(function (p) {
        if (!p.desktopOnly) out.push([p]);
      });
    }
    return out;
  }

  /* Busca en que vista aparece un numero de pagina (para el indice y para
     conservar el sitio al cambiar entre 1 y 2 paginas). */
  function viewOfPage(num) {
    var best = 0;
    for (var i = 0; i < views.length; i++) {
      for (var j = 0; j < views[i].length; j++) {
        if (views[i][j].n === num) return i;
        if (views[i][j].n <= num) best = i;
      }
    }
    return best;
  }

  function firstPageNum(viewIndex) {
    var v = views[viewIndex];
    return v && v[0] ? v[0].n : 1;
  }


  /* ========================== DIBUJAR PAGINAS ========================== */

  function headingHTML(page) {
    var h = '';
    if (page.eyebrow)    h += '<div class="ch-eyebrow">' + L(page.eyebrow) + '</div>';
    if (page.title)      h += '<div class="ch-title">' + L(page.title) + '</div>';
    if (page.section)    h += '<div class="sec-title">' + L(page.section) + '</div>';
    if (page.subsection) h += '<div class="subsec">' + L(page.subsection) + '</div>';
    return h;
  }

  function tocHTML(jumpable) {
    var c = CONTENT[state.lang] || CONTENT.en;
    var toc = (c && c.toc) || (CONTENT.en && CONTENT.en.toc) || { title: '', items: [] };
    var tag = jumpable ? 'button' : 'div';
    var html = '<div class="toc"><div class="toc-title">' + toc.title + '</div>';
    toc.items.forEach(function (it) {
      var cls = it.chapter ? 'toc-ch' : 'toc-item';
      html += '<' + tag + ' class="' + cls + '" data-page="' + it.page + '"' +
              (jumpable ? ' type="button"' : '') + '>' +
              '<span>' + it.label + '</span><span>' + it.page + '</span>' +
              '</' + tag + '>';
    });
    return html + '</div>';
  }

  function pageHTML(page) {
    var spread = state.spread;

    switch (page.type) {

      case 'img': {
        var src = (!spread && page.srcMobile) ? page.srcMobile : page.src;
        if (page.scroll) {
          return '<div class="pg-scroll"><img src="img/' + src + '" alt="" loading="lazy" draggable="false"></div>';
        }
        if (page.fit) {
          // Imagen completa, sin recortar (por ejemplo, infografias con
          // texto donde no se puede perder ni un borde).
          return '<div class="pg-fit"><img src="img/' + src + '" alt="" loading="lazy" draggable="false"></div>';
        }
        return '<img class="pg-img" src="img/' + src + '" alt="" loading="lazy" draggable="false">';
      }

      case 'split': {
        // En escritorio la imagen se reparte entre las dos paginas.
        // En movil se usa la version vertical, entera.
        if (spread) {
          return '<div class="pg-split pg-split--' + (page.half || 'left') + '" role="img" ' +
                 'style="background-image:url(img/' + page.src + ')"></div>';
        }
        var msrc = page.srcMobile || page.src;
        return '<div class="pg-fit"><img src="img/' + msrc + '" alt="" draggable="false"></div>';
      }

      case 'toc':
        return '<div class="pg-text js-fit pg-text--toc">' + tocHTML(true) +
               '<div class="pnum">' + page.n + '</div></div>';

      case 'text-img': {
        var st = styleString(page.imgStyle) || 'width:82%';
        return '<div class="pg-text js-fit">' +
                 headingHTML(page) + bodyFor(page.n) +
                 '<div class="pg-text__figure">' +
                   '<img src="img/' + page.src + '" alt="" draggable="false" style="' + st + '">' +
                 '</div>' +
                 '<div class="pnum">' + page.n + '</div>' +
               '</div>';
      }

      case 'closing':
        return '<div class="pg-closing">' +
                 '<div class="pg-closing__title">' + L('welcomeFamily') + '</div>' +
                 '<div class="pg-closing__logos">' +
                   '<img src="img/CTSNV.png" alt="Hilton Niseko Village" draggable="false">' +
                   '<img src="img/CTSHN.png" alt="Hinode Hills Niseko Village" draggable="false">' +
                   '<img src="img/CTSGL_Horz_Full_Color_RGB.png" alt="The Green Leaf Niseko Village, Tapestry Collection by Hilton" draggable="false">' +
                 '</div>' +
               '</div>';

      case 'text':
      default:
        return '<div class="pg-text js-fit">' +
                 headingHTML(page) + bodyFor(page.n) +
                 '<div class="pnum">' + page.n + '</div>' +
               '</div>';
    }
  }

  function buildSlide(viewIndex) {
    var slide = document.createElement('div');
    slide.className = 'slide';

    var pages = views[viewIndex] || [];
    pages.forEach(function (page, i) {
      var leaf = document.createElement('div');
      leaf.className = 'leaf ' + (state.spread
        ? (i === 0 ? 'leaf--left' : 'leaf--right')
        : 'leaf--single');
      leaf.innerHTML = pageHTML(page);
      slide.appendChild(leaf);
    });

    // Si el spread queda incompleto, rellena para que no se descuadre.
    if (state.spread && pages.length === 1) {
      var filler = document.createElement('div');
      filler.className = 'leaf leaf--right';
      slide.appendChild(filler);
    }

    if (state.spread) {
      var spine = document.createElement('div');
      spine.className = 'spine';
      spine.setAttribute('aria-hidden', 'true');
      slide.appendChild(spine);
    }

    return slide;
  }


  /* ======================= SECCION: AUTOAJUSTE =========================
     El tamaño de letra es el MISMO en todas las paginas: el que fijaste en
     SECCION: DENSIDAD (calculado a partir de la pagina mas ajustada, la de
     los hoteles). Esto de aqui es solo una red de seguridad: si alguna vez
     editas un texto y una pagina concreta queda demasiado larga para su
     hueco, se encoge ella sola lo minimo necesario para no generar scroll,
     en vez de romperse. Las demas paginas no se ven afectadas.

     Si quieres volver a que las paginas cortas crezcan mas que las largas
     (como estaba antes), sube `growLimit` por encima de 0. */

  var FIT = {
    step:      0.5,   // en que saltos se prueba el tamaño, en px
    growLimit: 0,      // 0 = tamaño uniforme; solo encoge, nunca agranda
    shrinkMax: 13,      // lo maximo que se le permite encoger si viene justa, en px
    floor:     11,      // nunca por debajo de esto, pase lo que pase
  };

  function fitOne(node) {
    var base = parseFloat(getComputedStyle(node).fontSize);
    node.style.fontSize = '';    // vuelve al tamaño del CSS antes de medir
    node.style.overflowY = '';   // idem con el scroll, para medir limpio

    function overflow() { return node.scrollHeight > node.clientHeight + 1; }

    // Si el texto cabe, se quita el overflow-y:auto del todo: en algunos
    // sistemas (Windows, o macOS con "mostrar barras siempre") una barra
    // de scroll se ve fija aunque no haya nada que desplazar. Si de verdad
    // no cupiera ni al tamaño minimo, se deja "auto": mejor poder
    // desplazarse que perder texto en silencio.
    function finish() {
      node.style.overflowY = overflow() ? 'auto' : 'hidden';
    }

    if (overflow()) {
      // La pagina viene justa con el tamaño base: se encoge lo minimo.
      var size = base;
      var floor = Math.max(FIT.floor, base - FIT.shrinkMax);
      while (size - FIT.step >= floor) {
        size -= FIT.step;
        node.style.fontSize = size + 'px';
        if (!overflow()) { finish(); return; }
      }
      finish();
      return;   // se queda en el tamaño mas pequeño probado
    }

    // Hay sitio de sobra: se agranda mientras siga cabiendo.
    var size = base, max = base + FIT.growLimit;
    while (size + FIT.step <= max) {
      node.style.fontSize = (size + FIT.step) + 'px';
      if (overflow()) { node.style.fontSize = size + 'px'; finish(); return; }
      size += FIT.step;
    }
    finish();
  }

  function fitVisiblePages() {
    var nodes = el.book.querySelectorAll('.slide:last-child .js-fit');
    // Se hace en dos pasadas: primero se quita el tamaño ajustado de todas
    // (para medir limpio), y luego se ajusta cada una. Si no, la pagina
    // izquierda podria medirse con el tamaño ya agrandado de una vuelta
    // anterior y arrastrar el error.
    for (var i = 0; i < nodes.length; i++) nodes[i].style.fontSize = '';
    for (var j = 0; j < nodes.length; j++) fitOne(nodes[j]);
  }
  /* ======================================================================= */


  /* ============================ NAVEGACION ============================= */

  function render() {
    el.book.innerHTML = '';
    el.book.appendChild(buildSlide(state.view));
    updateChrome();
    fitVisiblePages();
  }

  function prefersReducedMotion() {
    return window.matchMedia &&
           window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  var pendingFinish = null;   // cierra la animacion que este a medias

  function goTo(target, dir) {
    // Si se pide otra pagina mientras una esta entrando, se cierra la anterior
    // al instante en vez de ignorar el clic. Asi se puede avanzar rapido.
    if (pendingFinish) pendingFinish();

    if (target < 0 || target >= views.length || target === state.view) return;

    // Si el usuario pidio menos animacion, se cambia de pagina al instante.
    if (prefersReducedMotion()) {
      state.view = target;
      render();
      return;
    }

    var outgoing = el.book.querySelector('.slide');
    var incoming = buildSlide(target);

    incoming.style.transform = 'translateX(' + (dir > 0 ? '100%' : '-100%') + ')';
    el.book.appendChild(incoming);
    fitVisiblePages();

    state.view = target;
    updateChrome();

    // Fuerza al navegador a aplicar la posicion inicial antes de animar.
    void incoming.offsetWidth;

    animating = true;
    outgoing.classList.add('is-moving');
    incoming.classList.add('is-moving');
    outgoing.style.transform = 'translateX(' + (dir > 0 ? '-100%' : '100%') + ')';
    incoming.style.transform = 'translateX(0)';

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      pendingFinish = null;
      if (outgoing.parentNode) outgoing.parentNode.removeChild(outgoing);
      incoming.classList.remove('is-moving');
      incoming.style.transform = '';
      animating = false;
    }
    pendingFinish = finish;
    incoming.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, CONFIG.slideMs + 120);   // red de seguridad
  }

  function step(delta) {
    goTo(state.view + delta, delta);
  }

  function jumpToPage(num) {
    var target = viewOfPage(num);
    if (target === state.view) return;
    goTo(target, target > state.view ? 1 : -1);
  }

  function updateChrome() {
    var total = views.length;
    var pos   = state.view + 1;

    el.prevBtn.disabled = state.view === 0;
    el.nextBtn.disabled = state.view >= total - 1;
    el.progress.style.width = (total > 1 ? (state.view / (total - 1)) * 100 : 100) + '%';
    el.counter.textContent = pos + ' / ' + total;
  }


  /* ============================== TAMAÑO =============================== */

  function layout() {
    var r = el.stage.getBoundingClientRect();
    var spread = window.innerWidth >= CONFIG.desktopMinWidth;

    var pw, ph;
    if (spread) {
      var availW = (r.width - 24) / 2;
      var availH = r.height - 24;
      ph = availH;
      pw = ph * CONFIG.pageRatio;
      if (pw > availW) { pw = availW; ph = pw / CONFIG.pageRatio; }
    } else {
      pw = r.width - 16;
      ph = Math.min(r.height - 12, pw / CONFIG.mobilePageRatio);
    }

    el.book.style.width  = Math.floor(spread ? pw * 2 : pw) + 'px';
    el.book.style.height = Math.floor(ph) + 'px';

    if (spread !== state.spread) {
      var keep = firstPageNum(state.view);
      state.spread = spread;
      views = buildViews(spread);
      state.view = viewOfPage(keep);
      render();
    } else {
      // El ancho/alto pudo cambiar sin cruzar el umbral de escritorio
      // (p.ej. la barra del navegador se oculta al hacer scroll en movil).
      // El tamaño base del CSS usa vh, asi que conviene recalcular.
      fitVisiblePages();
    }
  }


  /* ============================== IDIOMA =============================== */

  function setLang(code) {
    if (!CONTENT[code]) return;
    state.lang = code;
    document.documentElement.lang = code;
    paintWelcome();
    paintChrome();
    render();
    paintDrawer();
  }

  function paintWelcome() {
    el.wTitle.innerHTML = UI('welcome') + '<br>Niseko Village';
    el.wSub.textContent   = UI('subtitle');
    el.wLabel.textContent = UI('selectLang');
    el.startBtn.textContent = UI('start') + ' →';

    el.langSelect.innerHTML = '';
    LANGS.forEach(function (code) {
      var c = CONTENT[code];
      var o = document.createElement('option');
      o.value = code;
      o.textContent = c.flag + ' ' + c.label;
      el.langSelect.appendChild(o);
    });
    el.langSelect.value = state.lang;
  }

  function paintChrome() {
    el.tocBtn.querySelector('span').textContent  = UI('contents');
    el.langBtn.querySelector('span').textContent = state.lang.toUpperCase();
    el.drawerTitle.textContent = UI('contents');
    el.hint.textContent = UI('hint');

    el.langList.innerHTML = '';
    LANGS.forEach(function (code) {
      var c = CONTENT[code];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'langmenu__item' + (code === state.lang ? ' is-active' : '');
      b.textContent = c.flag + ' ' + c.label;
      b.addEventListener('click', function () {
        setLang(code);
        el.langList.hidden = true;
      });
      el.langList.appendChild(b);
    });
  }

  function paintDrawer() {
    el.drawerBody.innerHTML = tocHTML(true);
    Array.prototype.forEach.call(
      el.drawerBody.querySelectorAll('[data-page]'),
      function (btn) {
        btn.addEventListener('click', function () {
          closeDrawer();
          jumpToPage(parseInt(btn.getAttribute('data-page'), 10));
        });
      }
    );
  }


  /* ============================== INDICE =============================== */

  function openDrawer()  { el.drawer.hidden = false; }
  function closeDrawer() { el.drawer.hidden = true; }


  /* ============================== GESTOS =============================== */

  function bindSwipe(target) {
    var x0 = 0, y0 = 0, tracking = false;

    target.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      x0 = e.clientX; y0 = e.clientY; tracking = true;
      pointerDidDrag = false;
    });

    target.addEventListener('pointermove', function (e) {
      if (!tracking) return;
      // Un movimiento minimo (mano temblando, dedo grueso) no cuenta como
      // arrastre real; solo lo que ya se notaria como un gesto.
      if (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10) {
        pointerDidDrag = true;
      }
    });

    target.addEventListener('pointerup', function (e) {
      if (!tracking) return;
      tracking = false;
      var dx = e.clientX - x0;
      var dy = e.clientY - y0;
      // Solo cuenta si el gesto es claramente horizontal, para no romper
      // el scroll vertical de las paginas largas.
      if (Math.abs(dx) < CONFIG.swipeThreshold) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.4) return;
      step(dx < 0 ? 1 : -1);
    });

    target.addEventListener('pointercancel', function () { tracking = false; });
  }


  /* ============================== ARRANQUE ============================= */

  function openReader() {
    el.welcome.hidden = true;
    el.reader.hidden  = false;
    layout();
    render();
    el.hint.classList.add('is-visible');
    setTimeout(function () { el.hint.classList.remove('is-visible'); }, 3500);
  }

  function goHome() {
    el.reader.hidden  = true;
    el.welcome.hidden = false;
    state.view = 0;
  }

  function init() {
    if (!PAGES.length) {
      el.welcome.innerHTML = '<p style="padding:24px">Falta la lista PAGES (SECCION: ESTRUCTURA).</p>';
      return;
    }

    state.spread = window.innerWidth >= CONFIG.desktopMinWidth;
    views = buildViews(state.spread);

    paintWelcome();
    paintChrome();
    paintDrawer();

    el.langSelect.addEventListener('change', function () { setLang(this.value); });
    el.startBtn.addEventListener('click', openReader);
    el.homeBtn.addEventListener('click', goHome);
    el.prevBtn.addEventListener('click', function () { step(-1); });
    el.nextBtn.addEventListener('click', function () { step(1); });

    el.tocBtn.addEventListener('click', openDrawer);
    el.drawerScrim.addEventListener('click', closeDrawer);
    el.drawerClose.addEventListener('click', closeDrawer);

    // La pagina 2 (el indice, dentro del libro) salta a la pagina igual que
    // el menu "Contents": un solo listener sirve para todas las veces que
    // se redibuje, no hace falta reengancharlo cada vez.
    el.book.addEventListener('click', function (e) {
      if (pointerDidDrag) return;   // fue un arrastre/swipe, no un toque real
      var btn = e.target.closest('[data-page]');
      if (!btn) return;
      jumpToPage(parseInt(btn.getAttribute('data-page'), 10));
    });

    el.langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      el.langList.hidden = !el.langList.hidden;
    });
    document.addEventListener('click', function () { el.langList.hidden = true; });

    document.addEventListener('keydown', function (e) {
      if (!el.reader.hidden) {
        if (e.key === 'ArrowRight') step(1);
        if (e.key === 'ArrowLeft')  step(-1);
        if (e.key === 'Escape')     closeDrawer();
      }
    });

    bindSwipe(el.stage);
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', function () {
      setTimeout(layout, 150);
    });

    // Las fuentes (Fraunces, Lato) tardan un poco en llegar de Google Fonts.
    // Hasta que cargan, el texto se mide con la fuente de reserva (Georgia /
    // la del sistema), que no ocupa exactamente el mismo alto de linea. Si
    // el ajuste automatico se hizo con esa medida provisional, puede quedar
    // corto en cuanto la fuente de verdad entra en juego. En cuanto el
    // navegador avisa de que las fuentes ya cargaron, se vuelve a ajustar
    // con la medida definitiva.
    if (window.document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { fitVisiblePages(); });
    }

    layout();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
